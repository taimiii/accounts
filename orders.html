<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Orders</title>
<link rel="stylesheet" href="style.css">
<style>
  select { width: 100%; padding: 12px; font-size: 1rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  option { background: var(--card); color: var(--text); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  .col button { width: 100%; margin-top: 10px; }
  .hide { display: none !important; }
  .sp { margin-top: 16px; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .btns button { margin-top: 12px; flex: 1 1 140px; }
  .row { display: grid; grid-template-columns: 1fr 138px; gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row > div:first-child { min-width: 0; overflow-wrap: anywhere; }
  .row small { display: block; color: var(--muted); }
  select.act { padding: 9px 8px; font-size: .88rem; }
  .tag { font-size: .72rem; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); margin-left: 6px; }
  .tag.Yellow { color: #d97706; border-color: #d97706; } .tag.Red { color: var(--err); border-color: var(--err); }
  .checks label { display: flex; align-items: center; gap: 8px; margin: 8px 0; color: var(--text); font-size: .95rem; }
  input[type=checkbox] { width: auto; }
  input[type=date] { width: 100%; padding: 12px; font-size: 1rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
</style>
</head>
<body>
<header>
  <div class="who"><b>Orders</b><small id="sub"></small></div>
  <button class="ghost" onclick="location.href='app.html'">Back</button>
</header>

<main class="wrap">
  <p class="err" id="err"></p>
  <div class="card">
    <div class="two">
      <div class="col">
        <input id="q" type="text" placeholder="Search invoice, customer, phone or CN" autocomplete="off">
        <button id="newBtn" onclick="location.href='neworder.html'">New order</button>
      </div>
      <div class="col">
        <select id="statusSel">
          <option value="All">All</option><option>Invoiced</option><option>Dispatched</option><option>Delivered</option>
          <option>Paid</option><option>Returned</option><option>Refused</option><option value="Cancelled">Cancelled</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card hide sp" id="apanel"></div>

  <div class="card sp"><div id="list">Loading...</div></div>
</main>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="invoice.js"></script>
<script>
  if (!Store.token || !can('orders')) location.replace('app.html');
  const $ = id => document.getElementById(id);
  const NEXT = { Invoiced: ['Dispatched', 'Cancelled'], Dispatched: ['Delivered', 'Returned', 'Refused'], Delivered: ['Returned'] };
  let status = 'All', rows = [], lists = null, timer = null;

  function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 3500); }
  function el(tag, text, cls) { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; }
  const money = v => 'Rs ' + Math.round(Number(v || 0)).toLocaleString('en-PK');
  const day = v => { const d = new Date(v); return v && !isNaN(d) ? d.toISOString().slice(0, 10) : ''; };

  $('statusSel').onchange = () => { status = $('statusSel').value; load(); };

  async function load() {
    $('err').textContent = '';
    if (!Store.storeId) { $('list').textContent = 'Select your working store on the dashboard first.'; $('sub').textContent = ''; return; }
    try {
      if (!lists) lists = await api('getLists');
      rows = await api('listOrders', { status: status === 'All' ? '' : status, q: $('q').value.trim(), storeId: Store.storeId });
      render();
    } catch (e) { $('err').textContent = e.message; $('list').textContent = ''; }
  }
  $('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 450); });

  const courierName = id => { const c = (lists.couriers || []).find(x => x.CourierID === id); return c ? c.CourierName : ''; };
  const storeName = id => { const s = (lists.stores || []).find(x => x.StoreID === id); return s ? s.StoreName : id; };

  function render() {
    $('sub').textContent = Store.storeName + '  |  ' + rows.length + ' shown' + (rows.length === 200 ? ' (latest 200)' : '');
    const box = $('list'); box.textContent = '';
    if (!rows.length) { box.textContent = 'No orders found.'; return; }
    rows.forEach(o => {
      const row = el('div', undefined, 'row'), left = el('div');
      const t = el('b', o.InvoiceNo); t.append(el('span', o.Status, 'tag'));
      if (o.Risk && o.Risk !== 'Green') t.append(el('span', o.Risk + ' risk', 'tag ' + o.Risk));
      left.append(t,
        el('small', day(o.OrderDate) + '  |  ' + storeName(o.StoreID)),
        el('small', (o.Customer || '-') + '  |  ' + (o.Phone || '')),
        el('small', o.Items || ''),
        el('small', 'Total ' + money(o.Total) + (o.Delivery ? ' (incl. delivery ' + money(o.Delivery) + ')' : '') + (o.Advance ? '  |  Advance ' + money(o.Advance) : '') + '  |  COD ' + money(o.COD) + (o.DeliveredDate ? '  |  Courier charge ' + money(o.Charge) : '') + (o.CN ? '  |  CN ' + o.CN : '') + (o.CourierID ? '  |  ' + courierName(o.CourierID) : '')));
      // one combo box with the actions that apply to this invoice
      const sel = el('select', undefined, 'act');
      const opts = [['', 'Actions'], ['invoice', 'Invoice'], ['edit', 'Edit']];
      if (can('delete_orders') && ['Invoiced', 'Dispatched', 'Cancelled', 'Delivered'].indexOf(o.Status) > -1) opts.push(['delete', 'Delete']);
      (NEXT[o.Status] || []).forEach(to => opts.push(['to:' + to, to === 'Dispatched' ? 'Dispatch' : to === 'Cancelled' ? 'Cancel' : to]));
      opts.forEach(x => { const op = el('option', x[1]); op.value = x[0]; sel.appendChild(op); });
      sel.onchange = async () => {
        const v = sel.value; sel.value = ''; if (!v) return;
        if (v === 'invoice') { try { Invoice.openDialog(await api('getInvoiceData', { orderId: o.OrderID })); } catch (e) { toast(e.message); } }
        else if (v === 'edit') location.href = 'neworder.html?edit=' + encodeURIComponent(o.OrderID);
        else if (v === 'delete') {
          if (!confirm('Delete invoice ' + o.InvoiceNo + ' (' + o.Customer + ', ' + money(o.Total) + ')?' + (o.Status === 'Delivered' ? '\nIts stock will be put back.' : '') + '\nThis cannot be undone.')) return;
          try { await api('deleteOrder', { orderId: o.OrderID }); toast('Invoice ' + o.InvoiceNo + ' deleted.'); await load(); } catch (e) { toast(e.message); }
        } else openAction(o, v.slice(3));
      };
      const right = el('div'); right.appendChild(sel);
      row.append(left, right); box.appendChild(row);
    });
  }

  /* ---------- Status actions ---------- */
  function openAction(o, to) {
    const p = $('apanel'); p.textContent = ''; p.classList.remove('hide');
    p.append(el('h2', to + ': ' + o.InvoiceNo), el('p', o.Customer + '  |  COD ' + money(o.COD), 'muted'));
    let courier = o.CourierID || '', dateEl = null, cnEl = null, chargeEl = null;

    if (to === 'Dispatched') {
      p.append(el('label', 'Courier *'));
      const box = el('div', undefined, 'checks'); p.appendChild(box);
      (lists.couriers || []).forEach(c => {
        const l = el('label'), i = el('input'); i.type = 'checkbox'; i.checked = c.CourierID === courier;
        i.onchange = () => { box.querySelectorAll('input').forEach(x => { if (x !== i) x.checked = false; }); courier = i.checked ? c.CourierID : ''; };
        l.append(i, document.createTextNode(' ' + c.CourierName)); box.appendChild(l);
      });
      p.append(el('label', 'CN / tracking number'));
      cnEl = el('input'); cnEl.type = 'text'; cnEl.value = o.CN || ''; cnEl.autocomplete = 'off'; p.appendChild(cnEl);
    }
    if (to === 'Delivered') {
      p.append(el('label', 'Delivery date (the date the courier delivered it)'));
      dateEl = el('input'); dateEl.type = 'date'; dateEl.value = new Date().toISOString().slice(0, 10); p.appendChild(dateEl);
    }
    if (to === 'Delivered' || to === 'Returned' || to === 'Refused') {   // courier charge, suggested from the rate card
      p.append(el('label', to === 'Delivered' ? 'Courier charges (delivery + COD fee), Rs' : 'Return charge, Rs'));
      chargeEl = el('input'); chargeEl.type = 'text'; chargeEl.inputMode = 'decimal'; chargeEl.autocomplete = 'off'; chargeEl.placeholder = 'Calculating...';
      const hint = el('small', '', 'muted'); hint.style.display = 'block'; hint.style.marginTop = '4px';
      p.append(chargeEl, hint);
      api('getChargeEstimate', { orderId: o.OrderID }).then(r => {
        const v = to === 'Delivered' ? r.total : r.returnCharge;
        chargeEl.placeholder = 'Enter amount';
        if (v !== '' && v !== null && !chargeEl.value) chargeEl.value = v;
        hint.textContent = (to === 'Delivered' ? '' : (r.returnRule ? 'Return rule: ' + r.returnRule + '. ' : '')) + r.notes.join(' ');
      }).catch(() => { chargeEl.placeholder = 'Enter amount'; });
    }
    if (to === 'Returned' || to === 'Refused' || to === 'Cancelled')
      p.append(el('p', 'This order will never count as revenue.' + (to === 'Cancelled' ? '' : ' Delivered stock goes back to its batch.'), 'muted'));

    const btns = el('div', undefined, 'btns');
    const ok = el('button', 'Confirm ' + to), no = el('button', 'Close', 'ghost');
    no.onclick = () => p.classList.add('hide');
    ok.onclick = async () => {
      ok.disabled = true;
      try {
        await api('setOrderStatus', { orderId: o.OrderID, status: to, courierId: courier, cn: cnEl ? cnEl.value : undefined, date: dateEl ? dateEl.value : undefined,
          charge: to === 'Delivered' && chargeEl ? chargeEl.value : undefined, returnCharge: (to === 'Returned' || to === 'Refused') && chargeEl ? chargeEl.value : undefined });
        toast(o.InvoiceNo + ' is now ' + to + '.'); p.classList.add('hide'); await load();
      } catch (e) { toast(e.message); ok.disabled = false; }
    };
    btns.append(ok, no); p.appendChild(btns); p.scrollIntoView({ behavior: 'smooth' });
  }

  load();
</script>
</body>
</html>
