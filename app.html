<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Accounts</title>
<link rel="stylesheet" href="style.css">
<style>
  .hide { display: none; }
  .sp { margin-top: 16px; }
  .checks label { display: flex; align-items: center; gap: 10px; margin: 10px 0; color: var(--text); font-size: 1rem; }
  input[type=checkbox] { width: auto; }
  .hbtns { display: flex; gap: 8px; }
  .cur { font-weight: 700; color: var(--brand); }
  .tile.off { opacity: .55; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .stat small { display: block; color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .4px; }
  .stat b { display: block; font-size: 1.25rem; margin-top: 4px; }
  .stat span { display: block; color: var(--muted); font-size: .8rem; margin-top: 2px; }
  .stat.bad b { color: var(--err); }
</style>
</head>
<body>
<header>
  <div class="who"><b id="name"></b><small id="role"></small></div>
  <div class="hbtns">
    <button class="ghost" id="pwBtn">Change password</button>
    <button class="ghost" id="logout">Log out</button>
  </div>
</header>

<main class="wrap">
  <div class="card hide" id="pwCard" style="max-width:380px">
    <h2>Change my password</h2>
    <label for="op">Current password</label>
    <input id="op" type="password" autocomplete="current-password">
    <label for="np">New password (min 8 characters)</label>
    <input id="np" type="password" autocomplete="new-password">
    <button id="chg">Change password</button>
    <p id="pmsg" class="err"></p>
  </div>

  <div class="card" id="storeCard">
    <h2>Working store</h2>
    <p class="muted" id="storeMsg">Loading your stores...</p>
    <div class="checks" id="stores"></div>
  </div>

  <div class="stats hide" id="stats"></div>

  <div class="grid sp" id="menu"></div>
</main>
<div id="toast"></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
  if (!Store.token || !Store.user) location.replace('index.html');
  const $ = id => document.getElementById(id);
  const user = Store.user;
  $('name').textContent = user.fullName;
  $('role').textContent = user.role;

  // 'store: true' = the tile works inside the store chosen above
  const MENU = [
    { t: 'Orders & Invoices', d: 'New order, status, invoice PDF', perms: ['orders'], page: 'orders.html', store: true },
    { t: 'Customers', d: 'Customer list and history', perms: ['customers', 'customers_view'], page: 'customers.html' },
    { t: 'Purchases & Stock', d: 'Purchase invoices, batches', perms: ['purchases'], page: 'stock.html', store: true },
    { t: 'Product List', d: 'View, print, download', perms: ['orders', 'purchases', 'reports'], page: 'products.html', store: true },
    { t: 'Courier Rates', d: 'Delivery charges by weight', perms: ['payments', 'users'], page: 'ratecards.html' },
    { t: 'Courier Payments', d: 'Receivables, remittances', perms: ['payments'], page: 'courierpay.html', store: true },
    { t: 'Vendor Payments', d: 'Payables and ledger', perms: ['payments'], page: 'vendorpay.html' },
    { t: 'Bank & Cash', d: 'Balances, transfers, statements', perms: ['payments', 'reports'], page: 'money.html' },
    { t: 'Expenses', d: 'Direct and indirect', perms: ['expenses'], page: 'expenses.html', store: true },
    { t: 'Reports & P&L', d: 'Statements, profit and loss', perms: ['reports'], page: 'reports.html' },
    { t: 'Month Lock & Backup', d: 'Close months, back up data', perms: ['users'], page: 'lock.html' },
    { t: 'Setup Lists', d: 'Products, stores, vendors, couriers', perms: ['users'], page: 'setup.html' },
    { t: 'Users & Access', d: 'Add users, set permissions', perms: ['users'], page: 'users.html' }
  ];

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 2800);
  }

  /* ---------- Menu tiles ---------- */
  function drawMenu() {
    const menu = $('menu'); menu.textContent = '';
    MENU.filter(m => m.perms.some(can)).forEach(m => {
      const b = document.createElement('button');
      b.className = 'tile' + (m.store && !Store.storeId ? ' off' : '');
      b.style.width = 'auto'; b.style.marginTop = '0'; b.style.color = 'inherit';
      const t = document.createElement('b'); t.textContent = m.t;
      const d = document.createElement('span'); d.textContent = m.d;
      b.append(t, d);
      b.onclick = () => {
        if (m.store && !Store.storeId) { toast('Select your working store first.'); $('storeCard').scrollIntoView({ behavior: 'smooth' }); return; }
        if (m.page) location.href = m.page; else toast('Coming in Step ' + m.step);
      };
      menu.appendChild(b);
    });
    if (!menu.children.length) menu.textContent = 'No modules are enabled for your role yet.';
  }

  /* ---------- Working store (one at a time, so stores never mix) ---------- */
  function drawStores(stores) {
    const box = $('stores'); box.textContent = '';
    if (!stores.length) { $('storeMsg').textContent = 'No store is available for your account.'; return; }
    $('storeMsg').textContent = Store.storeId ? 'You are working in: ' : 'Select the store you want to work in.';
    if (Store.storeId) { const c = document.createElement('span'); c.className = 'cur'; c.textContent = Store.storeName; $('storeMsg').appendChild(c); }
    stores.forEach(s => {
      const l = document.createElement('label'), i = document.createElement('input');
      i.type = 'checkbox'; i.checked = s.StoreID === Store.storeId;
      i.onchange = () => {
        box.querySelectorAll('input').forEach(x => { if (x !== i) x.checked = false; });
        Store.setStore(i.checked ? s.StoreID : '', i.checked ? s.StoreName : '');
        drawStores(stores); drawMenu(); loadStats();
        if (i.checked) toast('Working store: ' + s.StoreName);
      };
      l.append(i, document.createTextNode(' ' + s.StoreName)); box.appendChild(l);
    });
  }

  async function loadStores() {
    try {
      const L = await api('getLists');
      const stores = L.stores || [];
      // Only one store available: choose it automatically. A saved choice that is no longer valid is dropped.
      if (Store.storeId && !stores.some(s => s.StoreID === Store.storeId)) Store.setStore('', '');
      if (!Store.storeId && stores.length === 1) Store.setStore(stores[0].StoreID, stores[0].StoreName);
      drawStores(stores); drawMenu();
    } catch (e) { $('storeMsg').textContent = e.message; }
  }

  /* ---------- Header buttons ---------- */
  $('pwBtn').onclick = () => { $('pwCard').classList.toggle('hide'); if (!$('pwCard').classList.contains('hide')) $('pwCard').scrollIntoView({ behavior: 'smooth' }); };

  $('logout').onclick = async () => {
    try { await api('logout'); } catch (e) {}
    Store.clear(); location.replace('index.html');
  };

  $('chg').onclick = async () => {
    const m = $('pmsg'); m.className = 'err'; m.textContent = '';
    $('chg').disabled = true;
    try {
      await api('changePassword', { oldPassword: $('op').value, newPassword: $('np').value });
      m.className = 'good'; m.textContent = 'Password changed.';
      $('op').value = ''; $('np').value = '';
      setTimeout(() => $('pwCard').classList.add('hide'), 1800);
    } catch (e) { m.textContent = e.message; }
    $('chg').disabled = false;
  };

  /* ---------- Daily numbers for the working store ---------- */
  const rs = v => 'Rs ' + Math.round(Number(v || 0)).toLocaleString('en-PK');
  const note = (text, onclick) => { const x = document.createElement('div'); x.className = 'stat'; x.style.gridColumn = '1 / -1'; x.textContent = text; if (onclick) { x.style.cursor = 'pointer'; x.onclick = onclick; } return x; };

  async function loadStats() {
    const box = $('stats'); box.textContent = ''; box.classList.remove('hide');
    if (!Store.storeId) { box.appendChild(note("Select your working store above to see today's numbers.")); return; }
    const sid = Store.storeId; box.appendChild(note("Loading today's numbers..."));
    try {
      const d = await api('getDashboard', { storeId: sid });
      if (sid !== Store.storeId) return;   // the store was changed while loading
      box.textContent = '';
      const cards = [], add = (label, value, sub, bad, page) => cards.push({ label, value, sub, bad, page });
      if (d.todayOrders !== undefined) { add("Today's orders", d.todayOrders, rs(d.todaySales) + ' sales', false, 'orders.html'); add('To dispatch', d.toDispatch, d.inTransit + ' on the way', false, 'orders.html'); }
      if (d.courierDue !== undefined) add('Couriers will pay you', rs(d.courierDue), d.courierDueCount + ' delivered orders waiting, after courier charges' + (d.courierOverdue ? ' (' + d.courierOverdue + ' overdue)' : ''), d.courierOverdue > 0, 'courierpay.html');
      if (d.vendorOwed !== undefined) add('You owe vendors', rs(d.vendorOwed), '', false, 'vendorpay.html');
      if (d.lowStock !== undefined) add('Low stock', d.lowStock + d.outOfStock, d.outOfStock + ' out of stock', d.outOfStock > 0, 'stock.html');
      if (d.cashTotal !== undefined) add('Bank + cash', rs(d.cashTotal), 'all accounts', false, 'money.html');
      if (d.monthSales !== undefined) add('This month sales', rs(d.monthSales), '', false, 'reports.html');
      if (d.monthProfit !== undefined) add('This month profit', rs(d.monthProfit), 'after expenses of ' + rs(d.monthExpenses), d.monthProfit < 0, 'reports.html');
      cards.forEach(c => {
        const x = document.createElement('div'); x.className = 'stat' + (c.bad ? ' bad' : ''); x.style.cursor = 'pointer';
        const l = document.createElement('small'); l.textContent = c.label; const v = document.createElement('b'); v.textContent = c.value; const s = document.createElement('span'); s.textContent = c.sub;
        x.append(l, v, s); x.onclick = () => { location.href = c.page; }; box.appendChild(x);
      });
      if (!cards.length) box.appendChild(note('No numbers are enabled for your role.'));
    } catch (e) {
      if (sid !== Store.storeId) return;
      box.textContent = ''; box.appendChild(note('Could not load the numbers (' + e.message + '). Tap here to try again.', loadStats));
    }
  }

  drawMenu(); loadStores().then(loadStats);
</script>
</body>
</html>
