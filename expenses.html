<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Expenses</title>
<link rel="stylesheet" href="style.css">
<style>
  input[type=date], input[type=month] { width: 100%; padding: 12px; font-size: 1rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  .hide { display: none !important; } .sp { margin-top: 16px; }
  .ov { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 12px; }
  .modal { background: var(--card); color: var(--text); border-radius: 14px; padding: 18px; width: 100%; max-width: 760px; max-height: 92vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  #printArea { display: none; }
  @media print {
    body.printing > *:not(#printArea) { display: none !important; }
    body.printing #printArea { display: block; }
    #printArea .sheet { padding: 14mm; }
    @page { size: A4; margin: 0; }
  }

  .btns { display: flex; gap: 10px; flex-wrap: wrap; } .btns button { margin-top: 12px; flex: 1 1 130px; }
  .sum div { display: flex; justify-content: space-between; padding: 3px 0; }
  .sum .big { font-weight: 700; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 6px; }
  .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; } .row > div:first-child { flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
  .row small { display: block; color: var(--muted); }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; flex: 0 0 auto; }
  .tag { font-size: .72rem; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); margin-left: 6px; }
  .checks label { display: flex; align-items: center; gap: 10px; margin: 8px 0; color: var(--text); font-size: 1rem; }
  input[type=checkbox] { width: auto; }
  @media (max-width: 520px) { .row { flex-direction: column; align-items: stretch; gap: 8px; } .acts button { flex: 1; } }
</style>
</head>
<body>
<header>
  <div class="who"><b>Expenses</b><small id="sub"></small></div>
  <button class="ghost" onclick="location.href='app.html'">Back</button>
</header>

<main class="wrap">
  <p class="err" id="err"></p>
  <div class="card hide" id="nostore">
    <h2>Select a store first</h2>
    <p class="muted">Expenses are recorded inside one store. Choose your working store on the dashboard.</p>
    <div class="btns"><button onclick="location.href='app.html'">Go to dashboard</button></div>
  </div>

  <div id="main" class="hide">
    <div class="card">
      <label style="margin-top:0">Month</label><input id="mon" type="month">
      <div class="sum sp" id="sum"></div>
      <p class="muted" id="lockMsg"></p>
      <div class="btns"><button id="add">Add expense</button><button class="ghost" id="prn">Print statement</button><button class="ghost hide" id="pdf">Download PDF</button></div>
    </div>

    <div class="card hide sp" id="form">
      <h2 id="ftitle">Add expense</h2>
      <label>Expense type</label><div class="checks" id="types"></div>
      <label>Amount (Rs)</label><input id="amt" type="text" inputmode="decimal" autocomplete="off">
      <label>Date</label><input id="date" type="date">
      <label>Paid from</label><div class="checks" id="accts"></div>
      <label>Order source (optional, for ad spend)</label><div class="checks" id="srcs"></div>
      <div class="checks"><label><input type="checkbox" id="shared"> Shared by all stores</label></div>
      <label>Note (optional)</label><input id="note" type="text" autocomplete="off">
      <div class="btns"><button id="save">Save expense</button><button class="ghost" id="cancel">Cancel</button></div>
    </div>

    <div class="card sp"><div id="list">Loading...</div></div>
  </div>
</main>
<div id="toast"></div>
<div id="printArea"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script>
  if (!Store.token || !can('expenses')) location.replace('app.html');
  const $ = id => document.getElementById(id);
  const sid = Store.storeId;
  let types = [], accounts = [], sources = [], data = null, editId = '', pickType = '', pickAcct = '', pickSrc = '';

  function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 4000); }
  function el(tag, text, cls) { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; }
  const money = v => 'Rs ' + Number(v || 0).toLocaleString('en-PK', { maximumFractionDigits: 2 });
  const day = v => { const d = new Date(v); return v && !isNaN(d) ? d.toLocaleDateString('en-CA') : ''; };

  async function init() {
    if (!sid) { $('nostore').classList.remove('hide'); return; }
    $('main').classList.remove('hide'); $('sub').textContent = Store.storeName;
    $('mon').value = new Date().toLocaleDateString('en-CA').slice(0, 7);
    try { const L = await api('getLists'); types = L.expenseTypes || []; accounts = L.accounts || []; sources = L.sources || []; } catch (e) { $('err').textContent = e.message; }
    $('mon').onchange = load; load();
  }

  async function load() {
    $('err').textContent = '';
    try { data = await api('listExpenses', { storeId: sid, month: $('mon').value }); } catch (e) { $('err').textContent = e.message; return; }
    const s = $('sum'); s.textContent = '';
    [['Direct expenses', data.direct], ['Indirect expenses', data.indirect]].forEach(r => { const d = el('div'); d.append(el('span', r[0]), el('span', money(r[1]))); s.appendChild(d); });
    const big = el('div', undefined, 'big'); big.append(el('span', 'Total'), el('span', money(data.total))); s.appendChild(big);
    $('lockMsg').textContent = data.locked ? 'This month is locked. Expenses cannot be added, changed or deleted.' : '';
    $('add').classList.toggle('hide', data.locked);
    const box = $('list'); box.textContent = '';
    (data.auto || []).forEach(a => {   // courier costs, taken from the orders
      const row = el('div', undefined, 'row'), left = el('div'), t = el('b', a.label);
      t.append(el('span', a.group, 'tag'), el('span', 'Automatic', 'tag'));
      left.append(t, el('small', 'Calculated from your orders and courier payments. Change it in Orders or Courier Payments.'));
      const rt = el('div', undefined, 'acts'); rt.style.flexDirection = 'column'; rt.style.alignItems = 'flex-end'; rt.appendChild(el('b', money(a.amount)));
      row.append(left, rt); box.appendChild(row);
    });
    data.rows.forEach(r => {
      const row = el('div', undefined, 'row'), left = el('div'), t = el('b', r.type);
      t.append(el('span', r.group, 'tag')); if (r.shared) t.append(el('span', 'Shared', 'tag'));
      left.append(t, el('small', day(r.date) + '  |  ' + r.account + (r.source ? '  |  ' + r.source : '') + (r.note ? '  |  ' + r.note : '')));
      const rt = el('div', undefined, 'acts'); rt.style.flexDirection = 'column'; rt.style.alignItems = 'flex-end';
      rt.appendChild(el('b', money(r.amount)));
      if (!data.locked) {
        const bt = el('div', undefined, 'acts'), e = el('button', 'Edit', 'ghost'), d = el('button', 'Delete', 'ghost');
        e.onclick = () => openForm(r); d.onclick = () => del(r); bt.append(e, d); rt.appendChild(bt);
      }
      row.append(left, rt); box.appendChild(row);
    });
    if (!data.rows.length && !(data.auto || []).length) box.textContent = 'No expenses in this month.';
  }

  function tick(box, opts, current, onPick) {
    box.textContent = '';
    if (!opts.length) { box.textContent = 'Nothing available. Add items in Setup Lists.'; return; }
    opts.forEach(o => {
      const l = el('label'), i = el('input'); i.type = 'checkbox'; i.checked = o.id === current;
      i.onchange = () => { box.querySelectorAll('input').forEach(x => { if (x !== i) x.checked = false; }); onPick(i.checked ? o.id : ''); };
      l.append(i, document.createTextNode(' ' + o.label)); box.appendChild(l);
    });
  }

  function openForm(r) {
    editId = r ? r.id : ''; pickType = r ? r.typeId : ''; pickAcct = r ? r.accountId : ''; pickSrc = r ? (r.sourceId || '') : '';
    $('ftitle').textContent = r ? 'Edit expense' : 'Add expense';
    tick($('types'), types.map(t => ({ id: t.ExpenseTypeID, label: t.ExpenseType + ' (' + t.Group + ')' })), pickType, v => pickType = v);
    tick($('accts'), accounts.map(a => ({ id: a.AccountID, label: a.AccountName })), pickAcct, v => pickAcct = v);
    tick($('srcs'), sources.map(x => ({ id: x.SourceID, label: x.SourceName })), pickSrc, v => pickSrc = v);
    $('amt').value = r ? r.amount : ''; $('note').value = r ? r.note : ''; $('shared').checked = r ? r.shared : false;
    $('date').value = r ? day(r.date) : new Date().toLocaleDateString('en-CA');
    $('form').classList.remove('hide'); $('form').scrollIntoView({ behavior: 'smooth' });
  }
  $('add').onclick = () => openForm(null);
  $('cancel').onclick = () => $('form').classList.add('hide');
  $('save').onclick = async () => {
    $('save').disabled = true;
    try {
      await api('saveExpense', { expenseId: editId, storeId: sid, shared: $('shared').checked, typeId: pickType, accountId: pickAcct, sourceId: pickSrc,
        amount: $('amt').value, date: $('date').value, note: $('note').value });
      toast('Expense saved.'); $('form').classList.add('hide'); await load();
    } catch (e) { toast(e.message); }
    $('save').disabled = false;
  };
  async function del(r) {
    if (!confirm('Delete this expense (' + r.type + ', ' + money(r.amount) + ')?')) return;
    try { await api('deleteExpense', { expenseId: r.id }); toast('Expense deleted.'); await load(); } catch (e) { toast(e.message); }
  }

  /* ---------- Statement: print and PDF ---------- */
  function buildSheet() {
    const w = el('div', undefined, 'sheet'); w.style.cssText = 'font-family:Arial,sans-serif;color:#111;background:#fff;padding:8px';
    const h = el('div', 'Expenses Statement - ' + Store.storeName); h.style.cssText = 'font-size:16pt;font-weight:700';
    const d = el('div', 'Month: ' + $('mon').value); d.style.cssText = 'color:#555;margin:2px 0 10px';
    const t = el('table'); t.style.cssText = 'border-collapse:collapse;width:100%;font-size:10pt';
    const cell = (tag, text, right, bold) => { const c = el(tag, text); c.style.cssText = 'border:1px solid #999;padding:5px 7px;text-align:' + (right ? 'right' : 'left') + ';' + (bold || tag === 'th' ? 'font-weight:700;' : '') + (tag === 'th' ? 'background:#eee;' : ''); return c; };
    const hr = el('tr'); ['Date', 'Expense', 'Group', 'Paid from', 'Note', 'Amount'].forEach((c, i) => hr.appendChild(cell('th', c, i === 5))); t.appendChild(hr);
    const add = (cells, bold) => { const tr = el('tr'); cells.forEach((c, i) => tr.appendChild(cell('td', c, i === 5, bold))); t.appendChild(tr); };
    (data.auto || []).forEach(a => add(['', a.label, a.group, 'Automatic', '', money(a.amount)]));
    data.rows.forEach(r => add([day(r.date), r.type + (r.source ? ' (' + r.source + ')' : ''), r.group, r.account, (r.shared ? 'Shared. ' : '') + r.note, money(r.amount)]));
    add(['', 'Direct expenses', '', '', '', money(data.direct)], true);
    add(['', 'Indirect expenses', '', '', '', money(data.indirect)], true);
    add(['', 'Total', '', '', '', money(data.total)], true);
    w.append(h, d, t); return w;
  }
  $('prn').onclick = () => {
    if (!data) return toast('Wait for the list to load.');
    const a = $('printArea'); a.textContent = ''; a.appendChild(buildSheet()); document.body.classList.add('printing');
    window.onafterprint = () => { document.body.classList.remove('printing'); a.textContent = ''; };
    setTimeout(() => window.print(), 150);
  };
  $('pdf').classList.toggle('hide', !can('export'));
  $('pdf').onclick = async () => {
    if (!data) return toast('Wait for the list to load.');
    if (typeof html2pdf === 'undefined') return toast('PDF library did not load. Check your internet.');
    try { await api('logExport', { what: 'expenses statement', rows: data.rows.length }); } catch (e) { return toast(e.message); }
    $('pdf').disabled = true;
    try { await html2pdf().set({ margin: 8, filename: 'expenses-' + Store.storeName.replace(/\W+/g, '-') + '-' + $('mon').value + '.pdf', image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' } }).from(buildSheet()).save(); } catch (e) { toast(e.message); }
    $('pdf').disabled = false;
  };

  init();
</script>
</body>
</html>
