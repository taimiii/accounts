<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Users & Access</title>
<link rel="stylesheet" href="style.css">
<style>
  select { width: 100%; padding: 12px; font-size: 1rem; border: 1px solid var(--line);
           border-radius: 8px; background: var(--bg); color: var(--text); }
  select, option { color-scheme: light dark; }
  option { background: var(--card); color: var(--text); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px;
         padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row small { display: block; color: var(--muted); overflow-wrap: anywhere; }
  .row > div:first-child { flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; flex: 0 0 auto; }
  @media (max-width: 520px) {
    .row { flex-direction: column; align-items: stretch; gap: 8px; }
    .acts { justify-content: stretch; }
    .acts button { flex: 1; }
  }
  .tag { font-size: .72rem; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); margin-left: 6px; }
  .checks label { display: flex; align-items: center; gap: 8px; margin: 8px 0; color: var(--text); font-size: .95rem; }
  input[type=checkbox], input[type=radio] { width: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { width: auto; margin: 0; padding: 9px 16px; border: 1px solid var(--line); background: var(--bg);
          color: var(--text); border-radius: 99px; font-weight: 500; font-size: .92rem; }
  .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .hide { display: none; }
  .sp { margin-top: 16px; }
  .btns { display: flex; gap: 10px; }
  .btns button { margin-top: 16px; }
</style>
</head>
<body>
<header>
  <div class="who"><b>Users &amp; Access</b><small id="sub"></small></div>
  <button class="ghost" onclick="location.href='app.html'">Back</button>
</header>

<main class="wrap">
  <!-- USERS -->
  <div class="card">
    <h2>Users</h2>
    <div id="ulist"></div>
    <button id="addU">Add user</button>
  </div>

  <div class="card hide sp" id="uform">
    <h2 id="utitle">Add user</h2>
    <label>Username (lowercase, no spaces)</label><input id="uname" type="text" autocapitalize="none" autocomplete="off">
    <label>Full name</label><input id="fname" type="text" autocomplete="off">
    <label>Role (pick one)</label>
    <div class="chips" id="urole"></div>
    <label>Store access</label>
    <div class="checks" id="stores"></div>
    <div class="checks">
      <label><input type="checkbox" id="hidec"> Hide cost and profit from this user</label>
      <label><input type="checkbox" id="act" checked> Active (can sign in)</label>
    </div>
    <label id="pwlabel">Password (min 8 characters)</label><input id="upw" type="password" autocomplete="new-password">
    <div class="btns">
      <button id="saveU">Save user</button>
      <button class="ghost" id="cancelU">Cancel</button>
    </div>
  </div>

  <!-- ROLES -->
  <div class="card sp">
    <h2>Roles</h2>
    <p class="muted">A role is a set of permissions. Changes apply the next time a user signs in.</p>
    <div id="rlist"></div>
    <button id="addR">Add role</button>
  </div>

  <div class="card hide sp" id="rform">
    <h2 id="rtitle">Add role</h2>
    <label>Role name</label><input id="rname" type="text" autocomplete="off">
    <label>Permissions</label>
    <div class="checks" id="perms"></div>
    <div class="btns">
      <button id="saveR">Save role</button>
      <button class="ghost" id="cancelR">Cancel</button>
    </div>
  </div>
</main>
<div id="toast"></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
  if (!Store.token || !can('users')) location.replace('app.html');
  const $ = id => document.getElementById(id);
  const LABELS = {
    orders: 'Create orders and invoices', customers: 'Customers (add and edit)',
    customers_view: 'Customers (view only)', purchases: 'Purchases and stock',
    payments: 'Courier and vendor payments', expenses: 'Expenses',
    reports: 'Reports and P&L', export: 'Export to Excel', users: 'Manage users and roles'
  };
  let users = [], roles = [], allPerms = [], stores = [], editingId = null, editingRole = null, pickedRole = '';

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 3000);
  }
  function el(tag, text, cls) {
    const e = document.createElement(tag);
    if (text !== undefined) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }
  function check(value, text, checked, attr) {
    const l = el('label'); const i = el('input'); i.type = 'checkbox'; i.value = value; i.checked = checked;
    if (attr) i.setAttribute(attr, '1');
    l.append(i, document.createTextNode(' ' + text)); return l;
  }

  async function load() {
    try {
      const [u, r, l] = await Promise.all([api('listUsers'), api('listRoles'), api('getLists')]);
      users = u; roles = r.roles; allPerms = r.allPerms; stores = l.stores;
      renderUsers(); renderRoles();
      $('sub').textContent = users.length + ' users, ' + roles.length + ' roles';
    } catch (e) { toast(e.message); }
  }

  /* ---------- Users ---------- */
  function renderUsers() {
    const box = $('ulist'); box.textContent = '';
    users.forEach(u => {
      const row = el('div', undefined, 'row');
      const left = el('div');
      const name = el('b', u.FullName); name.append(el('span', String(u.Active).toUpperCase() === 'TRUE' ? 'Active' : 'Disabled', 'tag'));
      left.append(name, el('small', u.Username + '  |  ' + u.Role + '  |  stores: ' + (u.StoreAccess || 'all')));
      const isActive = String(u.Active).toUpperCase() === 'TRUE';
      const b = el('button', 'Edit', 'ghost'); b.onclick = () => openUser(u);
      const t = el('button', isActive ? 'Deactivate' : 'Activate', 'ghost');
      if (u.UserID === Store.user.userId) { t.disabled = true; t.title = 'You cannot deactivate yourself'; }
      t.onclick = () => toggleUser(u, !isActive);
      const right = el('div', undefined, 'acts');
      right.append(b, t);
      row.append(left, right); box.appendChild(row);
    });
  }

  function openUser(u) {
    editingId = u ? u.UserID : null;
    $('utitle').textContent = u ? 'Edit user' : 'Add user';
    $('uname').value = u ? u.Username : '';
    $('fname').value = u ? u.FullName : '';
    $('hidec').checked = u ? String(u.HideCostProfit).toUpperCase() === 'TRUE' : false;
    $('act').checked = u ? String(u.Active).toUpperCase() === 'TRUE' : true;
    $('upw').value = '';
    $('pwlabel').textContent = u ? 'New password (leave empty to keep the current one)' : 'Password (min 8 characters)';

    const sel = $('urole'); sel.textContent = '';
    pickedRole = u ? u.Role : '';
    if (!roles.length) sel.textContent = 'No roles found. Add a role first.';
    roles.forEach(r => {
      const b = el('button', r.RoleName, 'chip' + (r.RoleName === pickedRole ? ' on' : ''));
      b.type = 'button';
      b.onclick = () => { pickedRole = r.RoleName; [...sel.children].forEach(c => c.classList.toggle('on', c === b)); };
      sel.appendChild(b);
    });

    const acc = u ? String(u.StoreAccess || 'all') : 'all';
    const list = acc === 'all' ? [] : acc.split(',').map(x => x.trim());
    const box = $('stores'); box.textContent = '';
    const all = check('all', 'All stores', acc === 'all'); all.firstChild.id = 'allst'; box.appendChild(all);
    stores.forEach(s => box.appendChild(check(s.StoreID, s.StoreName, list.indexOf(s.StoreID) > -1, 'data-s')));
    $('uform').classList.remove('hide'); $('uform').scrollIntoView({ behavior: 'smooth' });
  }

  async function toggleUser(u, makeActive) {
    if (!confirm((makeActive ? 'Activate ' : 'Deactivate ') + u.FullName + '?')) return;
    try {
      await api('saveUser', {
        userId: u.UserID, username: u.Username, fullName: u.FullName, role: u.Role,
        storeAccess: u.StoreAccess || 'all', hideCost: String(u.HideCostProfit).toUpperCase() === 'TRUE',
        active: makeActive
      });
      toast(u.FullName + (makeActive ? ' activated.' : ' deactivated.')); await load();
    } catch (e) { toast(e.message); }
  }

  $('addU').onclick = () => openUser(null);
  $('cancelU').onclick = () => $('uform').classList.add('hide');
  $('saveU').onclick = async () => {
    if (!pickedRole) { toast('Please pick a role.'); return; }
    const all = $('allst').checked;
    const sel = [...document.querySelectorAll('#stores input[data-s]:checked')].map(x => x.value);
    if (!all && !sel.length) { toast('Pick at least one store, or All stores.'); return; }
    $('saveU').disabled = true;
    try {
      await api('saveUser', {
        userId: editingId, username: $('uname').value, fullName: $('fname').value,
        role: pickedRole, storeAccess: all ? 'all' : sel.join(','),
        hideCost: $('hidec').checked, active: $('act').checked, password: $('upw').value
      });
      toast('User saved.'); $('uform').classList.add('hide'); await load();
    } catch (e) { toast(e.message); }
    $('saveU').disabled = false;
  };

  /* ---------- Roles ---------- */
  function renderRoles() {
    const box = $('rlist'); box.textContent = '';
    roles.forEach(r => {
      const row = el('div', undefined, 'row');
      const left = el('div'); left.append(el('b', r.RoleName), el('small', r.Permissions || '(no permissions)'));
      row.appendChild(left);
      if (r.RoleName !== 'Owner') { const b = el('button', 'Edit', 'ghost'); b.onclick = () => openRole(r); const a = el('div', undefined, 'acts'); a.appendChild(b); row.appendChild(a); }
      box.appendChild(row);
    });
  }

  function openRole(r) {
    editingRole = r ? r.RoleName : null;
    $('rtitle').textContent = r ? 'Edit role' : 'Add role';
    $('rname').value = r ? r.RoleName : ''; $('rname').readOnly = !!r;
    const have = r ? String(r.Permissions).split(',').map(x => x.trim()) : [];
    const box = $('perms'); box.textContent = '';
    allPerms.forEach(p => box.appendChild(check(p, LABELS[p] || p, have.indexOf(p) > -1)));
    $('rform').classList.remove('hide'); $('rform').scrollIntoView({ behavior: 'smooth' });
  }

  $('addR').onclick = () => openRole(null);
  $('cancelR').onclick = () => $('rform').classList.add('hide');
  $('saveR').onclick = async () => {
    const perms = [...document.querySelectorAll('#perms input:checked')].map(x => x.value);
    $('saveR').disabled = true;
    try {
      await api('saveRole', { name: $('rname').value, perms: perms });
      toast('Role saved.'); $('rform').classList.add('hide'); await load();
    } catch (e) { toast(e.message); }
    $('saveR').disabled = false;
  };

  load();
</script>
</body>
</html>
