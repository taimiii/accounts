<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>New order</title>
<link rel="stylesheet" href="style.css">
<style>
  select, input[type=date] { width: 100%; padding: 12px; font-size: 1rem; border: 1px solid var(--line);
                             border-radius: 8px; background: var(--bg); color: var(--text); }
  option { background: var(--card); color: var(--text); }
  input[readonly] { opacity: .8; }
  .hide { display: none; }
  .sp { margin-top: 16px; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .btns button { margin-top: 14px; flex: 1 1 140px; }
  .invtitle { text-align: center; font-size: 22pt; font-weight: 700; letter-spacing: 2px; margin-bottom: 14px; }
  .h12 { font-size: 12pt; font-weight: 700; margin: 0 0 8px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .two input[type=text] { margin-bottom: 8px; }
  .two label { margin-top: 6px; }
  small.info { display: block; margin-top: 4px; color: var(--muted); }

  .ihead, .irow { display: grid; grid-template-columns: 120px 1fr 70px 110px 120px 34px; gap: 8px; align-items: center; }
  .ihead { font-weight: 700; font-size: .85rem; color: var(--muted); border-bottom: 1px solid var(--line); padding: 6px 0; }
  .irow { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .irow input[type=text] { padding: 9px; }
  .cell { position: relative; }
  .amt { text-align: right; font-weight: 600; }
  .rm { width: 34px; margin: 0; padding: 6px 0; }
  .sugg { position: absolute; left: 0; right: 0; top: 100%; z-index: 20; background: var(--card);
          border: 1px solid var(--line); border-radius: 8px; max-height: 220px; overflow: auto; }
  .sugg button { display: block; width: 100%; margin: 0; padding: 10px; text-align: left; background: transparent;
                 color: var(--text); border: 0; border-bottom: 1px solid var(--line); border-radius: 0; font-weight: 500; font-size: .92rem; }
  .addrow { margin-top: 10px; }

  .totals { margin: 18px 0 0 auto; max-width: 300px; }
  .trow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 3px 0; }
  .trow input { width: 90px; padding: 6px 8px; text-align: right; }
  .s10 { font-size: 10pt; } .s15 { font-size: 15pt; font-weight: 700; border-top: 2px solid var(--text); margin-top: 4px; padding-top: 6px; }

  .risk { border-left: 5px solid var(--line); padding: 10px 12px; border-radius: 8px; background: var(--bg); margin-top: 8px; }
  .risk.green { border-color: #15803d; } .risk.yellow { border-color: #d97706; } .risk.red { border-color: #b91c1c; }
  .risk b.green { color: #15803d; } .risk b.yellow { color: #d97706; } .risk b.red { color: #b91c1c; }
  .risk ul { margin: 6px 0 0; padding-left: 18px; }

  @media (max-width: 700px) {
    .two { grid-template-columns: 1fr; gap: 12px; }
    .ihead { display: none; }
    .irow { grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-top: 10px; }
    .cell::before { content: attr(data-l); display: block; font-size: .72rem; color: var(--muted); }
    .cell.sku, .cell.desc, .cell.x { grid-column: 1 / -1; }
    .rm { width: 100%; }
    .totals { max-width: none; }
  }
</style>
</head>
<body>
<header>
  <div class="who"><b id="ttl">New order</b><small id="sub"></small></div>
  <button class="ghost" onclick="location.href='orders.html'">Orders</button>
</header>

<main class="wrap">
  <p class="err" id="err"></p>

  <div class="card hide" id="nostore">
    <h2>Select a store first</h2>
    <p class="muted">Orders are always created inside one store. Choose your working store on the dashboard.</p>
    <div class="btns"><button onclick="location.href='app.html'">Go to dashboard</button></div>
  </div>

  <div class="card hide" id="done">
    <h2 id="doneTitle"></h2>
    <p id="doneText" class="muted"></p>
    <div class="btns">
      <button id="reopen">Print / Save PDF</button>
      <button class="ghost" onclick="location.reload()">New order</button>
      <button class="ghost" onclick="location.href='orders.html'">View orders</button>
    </div>
  </div>

  <div class="card hide" id="sheet">
    <div class="invtitle">Invoice</div>

    <!-- Block 1 -->
    <div class="two">
      <div>
        <div class="h12">Bill To</div>
        <input id="cname" type="text" placeholder="Name" autocomplete="off">
        <input id="a1" type="text" placeholder="Address line 1" autocomplete="off">
        <input id="a2" type="text" placeholder="Address line 2" autocomplete="off">
        <input id="ccity" type="text" placeholder="City" autocomplete="off">
        <input id="cemail" type="text" placeholder="Email" inputmode="email" autocapitalize="none" autocomplete="off">
        <input id="phone" type="text" placeholder="Phone No (03001234567)" inputmode="tel" autocomplete="off">
        <small class="info" id="custInfo"></small>
        <div class="risk hide" id="risk"></div>
      </div>
      <div>
        <label>Invoice No</label><input id="invno" type="text" placeholder="Invoice No" autocomplete="off">
        <label>Billing Date</label><input id="bdate" type="date">
        <label>Billing Terms</label>
        <select id="terms">
          <option>Cash On Delivery</option><option>Advanced Cash</option><option>Zero Payment</option>
        </select>
        <div id="advBox" class="hide"><label>Advance Amount</label><input id="adv" type="text" inputmode="decimal" value="0"></div>
        <label>Courier</label>
        <select id="courier"><option value="">Select courier</option></select>
      </div>
    </div>

    <!-- Block 2 -->
    <div class="h12" style="margin-top:22px">Invoice Details</div>
    <div class="ihead"><div>SKU</div><div>Description</div><div>Qty</div><div>Unit Price</div><div style="text-align:right">Amount</div><div></div></div>
    <div id="rows"></div>
    <button class="ghost addrow" id="addRow">+ Add item</button>

    <!-- Block 3 -->
    <div class="totals">
      <div class="trow s10"><span>SUBTOTAL</span><span id="tsub">0</span></div>
      <div class="trow s10"><span>DISCOUNT %</span><input id="dpct" type="text" inputmode="decimal" value="0"></div>
      <div class="trow s10"><span>DISCOUNT</span><span id="tdisc">0</span></div>
      <div class="trow s15"><span>TOTAL</span><span id="ttot">0</span></div>
      <small class="info" id="collect"></small>
    </div>

    <label style="margin-top:18px">Note (optional)</label>
    <input id="note" type="text" autocomplete="off">
    <div id="reasonBox" class="hide">
      <label>High risk: reason to continue *</label><input id="reason" type="text" autocomplete="off">
    </div>
    <div class="btns"><button id="save" disabled>Create Order</button></div>
  </div>
</main>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="invoice.js"></script>
<script>
  if (!Store.token || !can('orders')) location.replace('app.html');
  const $ = id => document.getElementById(id);
  const sid = Store.storeId;
  const editId = new URLSearchParams(location.search).get('edit') || '';
  let L = null, P = [], rows = [], riskTimer = null, lastPhone = '', prevTerms = 'Cash On Delivery', lastData = null, frozen = false;

  function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 3500); }
  function el(tag, text, cls) { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; }
  const n = v => { const x = parseFloat(v); return isNaN(x) ? 0 : x; };
  const money = v => 'Rs ' + Number(v || 0).toLocaleString('en-PK', { maximumFractionDigits: 2 });

  async function init() {
    if (!sid) { $('nostore').classList.remove('hide'); return; }
    $('sub').textContent = Store.storeName;
    try { L = await api('getLists'); } catch (e) { $('err').textContent = e.message; return; }
    if (!L.stores.some(s => s.StoreID === sid)) { Store.setStore('', ''); $('nostore').classList.remove('hide'); return; }
    P = L.products.filter(p => p.StoreID === sid);
    L.couriers.forEach(c => { const o = el('option', c.CourierName); o.value = c.CourierID; $('courier').appendChild(o); });
    $('bdate').value = new Date().toLocaleDateString('en-CA');
    if (editId) { await loadForEdit(); return; }
    $('sheet').classList.remove('hide');
    addRow(); totals();
    $('save').disabled = false;
  }

  /* ---------- Edit an existing invoice ---------- */
  async function loadForEdit() {
    let o;
    try { o = await api('getOrderForEdit', { orderId: editId }); } catch (e) { $('err').textContent = e.message; return; }
    if (o.storeId !== sid) {
      $('nostore').querySelector('h2').textContent = 'Switch store first';
      $('nostore').querySelector('p').textContent = 'This invoice belongs to another store. Select that store on the dashboard, then edit it.';
      $('nostore').classList.remove('hide'); return;
    }
    $('ttl').textContent = 'Edit invoice'; $('save').textContent = 'Save changes';
    const c = o.customer, lines = String(c.address || '').split('\n');
    $('cname').value = c.name; $('a1').value = lines[0] || ''; $('a2').value = lines.slice(1).join(', ');
    $('ccity').value = c.city; $('cemail').value = c.email; $('phone').value = c.phone; lastPhone = c.phone;
    $('invno').value = o.invoiceNo; $('bdate').value = new Date(o.date).toLocaleDateString('en-CA');
    $('terms').value = o.terms; $('courier').value = o.courierId; $('dpct').value = o.discountPercent;
    $('adv').value = o.advance; $('note').value = o.note;
    $('rows').textContent = ''; rows = [];
    o.items.forEach(i => addRow({ pid: i.productId, sku: i.sku, desc: i.desc, qty: i.qty, price: i.price }));
    if (!rows.length) addRow();
    applyTerms();
    if (o.frozen) {   // paid / returned / refused / cancelled: only details can change
      frozen = true;
      document.querySelectorAll('#rows input, #rows button, #addRow, #terms, #dpct, #adv').forEach(x => x.disabled = true);
      $('custInfo').textContent = 'This invoice is ' + o.status + ': products and amounts are locked. You can still change the details above.';
    }
    $('sheet').classList.remove('hide'); $('save').disabled = false; totals();
  }

  /* ---------- Customer lookup (fills only empty fields) ---------- */
  async function lookup() {
    const p = $('phone').value.trim();
    if (p === lastPhone || p.replace(/\D/g, '').length < 10) return; lastPhone = p;
    $('custInfo').textContent = 'Checking...';
    try {
      const r = await api('getCustomerByPhone', { phone: p });
      if (!r.valid) $('custInfo').textContent = 'This does not look like a valid mobile number.';
      else if (r.customer) {
        const c = r.customer, lines = String(c.Address || '').split('\n');
        if (!$('cname').value) $('cname').value = c.Name || '';
        if (!$('a1').value) $('a1').value = lines[0] || '';
        if (!$('a2').value) $('a2').value = lines.slice(1).join(', ');
        if (!$('ccity').value) $('ccity').value = c.City || '';
        if (!$('cemail').value) $('cemail').value = c.Email || '';
        $('custInfo').textContent = 'Existing customer: ' + r.stats.orders + ' orders, ' + r.stats.returned + ' returned.';
      } else $('custInfo').textContent = 'New customer. It is saved automatically with this order.';
    } catch (e) { $('custInfo').textContent = e.message; }
    scheduleRisk();
  }
  $('phone').addEventListener('blur', lookup);
  $('phone').addEventListener('change', lookup);
  $('a1').addEventListener('blur', scheduleRisk); $('a2').addEventListener('blur', scheduleRisk);

  /* ---------- Duplicate / risky order banner ---------- */
  function scheduleRisk() { if (editId) return; clearTimeout(riskTimer); riskTimer = setTimeout(runRisk, 500); }
  async function runRisk() {
    const phone = $('phone').value.trim(); if (phone.replace(/\D/g, '').length < 10) return;
    try {
      const r = await api('getRisk', { phone: phone, address: $('a1').value + ' ' + $('a2').value, productIds: rows.map(x => x.pid).filter(Boolean) });
      const box = $('risk'); box.className = 'risk ' + r.level.toLowerCase(); box.textContent = '';
      box.appendChild(el('b', { Green: 'OK to proceed', Yellow: 'Verify before dispatch', Red: 'HIGH RISK' }[r.level], r.level.toLowerCase()));
      if (r.reasons.length) { const ul = el('ul'); r.reasons.forEach(x => ul.appendChild(el('li', x))); box.appendChild(ul); }
      $('reasonBox').classList.toggle('hide', r.level !== 'Red');
    } catch (e) { /* the server checks again when saving */ }
  }

  /* ---------- Invoice details rows ---------- */
  function addRow(init) {
    const r = Object.assign({ pid: '', sku: '', desc: '', qty: 1, price: 0 }, init || {}); rows.push(r);
    const d = el('div', undefined, 'irow'), cells = {};
    const cell = (cls, label) => { const c = el('div', undefined, 'cell ' + cls); c.dataset.l = label; d.appendChild(c); return c; };
    const inp = (parent, ph) => { const i = el('input'); i.type = 'text'; i.autocomplete = 'off'; if (ph) i.placeholder = ph; parent.appendChild(i); return i; };

    const cSku = cell('sku', 'SKU'), iSku = inp(cSku);
    const cDesc = cell('desc', 'Description'), iDesc = inp(cDesc, 'Type product name'), sug = el('div', undefined, 'sugg hide'); cDesc.appendChild(sug);
    const cQty = cell('qty', 'Qty'), iQty = inp(cQty); iQty.inputMode = 'numeric'; iQty.value = r.qty;
    const cPrice = cell('price', 'Unit Price'), iPrice = inp(cPrice); iPrice.inputMode = 'decimal'; iPrice.value = r.price;
    const cAmt = cell('amt', 'Amount'), amt = el('div', '0', 'amt'); cAmt.appendChild(amt);
    const cX = cell('x', ''), rm = el('button', 'x', 'ghost rm'); cX.appendChild(rm);

    const refresh = () => { amt.textContent = money(r.qty * r.price); totals(); };
    const pick = p => {
      r.pid = p.ProductID; r.sku = p.SKU || ''; r.desc = p.ProductName; r.price = n(p.SellingPrice);
      iSku.value = r.sku; iDesc.value = r.desc; iPrice.value = r.price; sug.classList.add('hide'); refresh(); scheduleRisk();
    };
    iSku.oninput = () => { const v = iSku.value.trim().toLowerCase(); const p = v && P.find(x => String(x.SKU || '').toLowerCase() === v); if (p) pick(p); else { r.pid = ''; r.sku = iSku.value; } };
    iDesc.oninput = () => {
      r.pid = ''; r.desc = iDesc.value; sug.textContent = '';
      const q = iDesc.value.trim().toLowerCase();
      const list = q ? P.filter(p => (p.ProductName + ' ' + (p.SKU || '')).toLowerCase().indexOf(q) > -1).slice(0, 6) : [];
      list.forEach(p => {
        const b = el('button', p.ProductName + (p.SKU ? '  (' + p.SKU + ')' : '') + '  -  ' + money(n(p.SellingPrice)));
        b.type = 'button'; b.addEventListener('pointerdown', e => { e.preventDefault(); pick(p); }); sug.appendChild(b);
      });
      sug.classList.toggle('hide', !list.length);
    };
    iDesc.onblur = () => setTimeout(() => sug.classList.add('hide'), 200);
    iQty.oninput = () => { r.qty = Math.max(0, Math.floor(n(iQty.value))); refresh(); };
    iPrice.oninput = () => { r.price = Math.max(0, n(iPrice.value)); refresh(); };
    rm.onclick = () => { rows.splice(rows.indexOf(r), 1); d.remove(); if (!rows.length) addRow(); totals(); scheduleRisk(); };
    iSku.value = r.sku; iDesc.value = r.desc; amt.textContent = money(r.qty * r.price);
    $('rows').appendChild(d);
  }
  $('addRow').onclick = () => addRow();

  /* ---------- Totals and billing terms ---------- */
  function calc() {
    const sub = rows.reduce((a, r) => a + r.qty * r.price, 0);
    const pct = Math.min(100, Math.max(0, n($('dpct').value)));
    const disc = Math.round(sub * pct) / 100, total = sub - disc, t = $('terms').value;
    const adv = t === 'Advanced Cash' ? Math.min(total, Math.max(0, n($('adv').value))) : 0;
    return { sub: sub, pct: pct, disc: disc, total: total, adv: adv, cod: total - adv, t: t };
  }
  function totals() {
    const c = calc();
    $('tsub').textContent = money(c.sub); $('tdisc').textContent = money(c.disc); $('ttot').textContent = money(c.total);
    $('collect').textContent = c.t === 'Advanced Cash' ? 'Advance received: ' + money(c.adv) + '.  To collect on delivery: ' + money(c.cod)
      : c.t === 'Zero Payment' ? 'Free order. Nothing to collect.' : 'To collect on delivery: ' + money(c.cod);
  }
  // Advance Amount shows only for "Advanced Cash"; Zero Payment fixes the discount at 100%
  function applyTerms() {
    const t = $('terms').value;
    $('advBox').classList.toggle('hide', t !== 'Advanced Cash');
    if (t !== 'Advanced Cash') $('adv').value = '0';
    if (t === 'Zero Payment') { $('dpct').value = '100'; $('dpct').disabled = true; }
    else { $('dpct').disabled = frozen; if (prevTerms === 'Zero Payment') $('dpct').value = '0'; }
    prevTerms = t; totals();
  }
  $('terms').onchange = applyTerms;
  ['dpct', 'adv'].forEach(id => $(id).addEventListener('input', totals));

  /* ---------- Create order, then the print / PDF popup ---------- */
  $('save').onclick = async () => {
    if (!$('invno').value.trim()) return toast('Enter the Invoice No.');
    const filled = rows.filter(r => r.pid || r.desc.trim());
    if (!filled.length) return toast('Add at least one product.');
    const bad = filled.findIndex(r => !r.pid);
    if (bad > -1) return toast('Item ' + (bad + 1) + ': pick the product from the suggestions list.');
    if (filled.some(r => r.qty < 1)) return toast('Every item needs a quantity of 1 or more.');
    const c = calc();
    $('save').disabled = true; $('save').textContent = 'Saving...';
    try {
      const r = await api(editId ? 'updateOrder' : 'createOrder', {
        orderId: editId, invoiceNo: $('invno').value.trim(), storeId: sid, phone: $('phone').value,
        customer: { name: $('cname').value, city: $('ccity').value, email: $('cemail').value,
                    address: [$('a1').value.trim(), $('a2').value.trim()].filter(Boolean).join('\n') },
        items: filled.map(x => ({ productId: x.pid, qty: x.qty, unitPrice: x.price })),
        discountPercent: c.pct, billingTerms: c.t, billingDate: $('bdate').value, advance: c.adv,
        courierId: $('courier').value, invoiceNote: $('note').value, overrideReason: $('reason').value
      });
      lastData = await api('getInvoiceData', { orderId: r.orderId });
      $('sheet').classList.add('hide'); $('done').classList.remove('hide');
      $('doneTitle').textContent = (editId ? 'Invoice saved: ' : 'Order created: ') + r.invoiceNo;
      $('doneText').textContent = editId ? 'Your changes are saved.' : (r.cod > 0 ? 'Cash to collect: ' + money(r.cod) + '. ' : '') + 'Risk: ' + r.risk + '.';
      window.scrollTo(0, 0);
      Invoice.openDialog(lastData);
    } catch (e) { toast(e.message); $('save').disabled = false; $('save').textContent = editId ? 'Save changes' : 'Create Order'; }
  };
  $('reopen').onclick = () => { if (lastData) Invoice.openDialog(lastData); };

  init();
</script>
</body>
</html>
